name: Release

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
      # guard against a tag that disagrees with the project version
      - name: Verify tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          test "$tag" = "$version" || {
            echo "tag $tag does not match project version $version"
            exit 1
          }
      - name: Build sdist and wheel
        run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deep-learning-toolkit
    permissions:
      # the token is required for OIDC trusted publisher
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # no checkout here, so skip the cache and the workdir probe
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: false
          ignore-empty-workdir: true
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
