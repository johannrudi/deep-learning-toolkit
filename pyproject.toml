[project]
name =  "deep-learning-toolkit"
version = "0.4.1"
authors = [
    { name = "Johann Rudi", email = "jrudi@vt.edu" },
]
description = "Deep Learning Toolkit — Reusable PyTorch building blocks for artificial intelligence and scientific machine learning: networks, losses, training loops, and utilities."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
keywords = [
    "artificial intelligence",
    "deep learning",
    "machine learning",
    "neural networks",
    "scientific computing",
    "pytorch",
]
requires-python = ">=3.11"

# Normal dependencies
dependencies = [
    "matplotlib>=3,<4",
    "prettytable>=3,<4",
    "pyyaml>=6,<7",
    "torch>=2,<3",
    "tqdm>=4,<5",
]

# Development dependencies
# (https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies)
[dependency-groups]
dev = [
    "basedpyright>=1.39,<2",
    "black>=25,<26",
    "bumpver>=2026",
    "flow-matching>=1.0.10,<2",
    "isort>=5,<6",
    "pytest>=8,<9",
    "torch-kde>=0.1.5",
]

# Published optional dependencies
[project.optional-dependencies]
diffusion = [
    "flow-matching>=1.0.10,<2",
]
kde = [
    "torch-kde>=0.1.5",
]

[project.urls]
Homepage = "https://github.com/johannrudi/deep-learning-toolkit"
Repository = "https://github.com/johannrudi/deep-learning-toolkit"
Issues = "https://github.com/johannrudi/deep-learning-toolkit/issues"

#[project.scripts]
#dlk = "dlk.__main__:main"

# --------------------------------------
# Tools
# --------------------------------------

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.bumpver]
current_version = "0.4.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
tag_name = "v{new_version}"
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"dlk/__init__.py" = [
    '__version__ = "{version}"',
]
"CITATION.cff" = [
    'version: "{version}"',
]

[tool.isort]
profile = "black"
src_paths = ["dlk", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# --------------------------------------
# Build System
# --------------------------------------

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.1,<0.13"

# set a custom module location
[tool.uv.build-backend]
module-name = "dlk"
module-root = ""
