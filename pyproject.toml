[project]
name =  "deep-learning-toolkit"
version = "0.4.1"
authors = [
    { name = "Johann Rudi", email = "jrudi@vt.edu" },
]
description = "Deep Learning Toolkit: Reusable PyTorch building blocks for artificial intelligence and scientific machine learning: networks, losses, training loops, and utilities."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
keywords = [
    "artificial intelligence",
    "deep learning",
    "machine learning",
    "neural networks",
    "scientific computing",
    "pytorch",
]
requires-python = ">=3.11"

# Normal dependencies
dependencies = [
    "matplotlib>=3,<4",
    "prettytable>=3,<4",
    "pyyaml>=6,<7",
    "torch>=2,<3",
    "tqdm>=4,<5",
]

# Development dependencies
# (https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies)
[dependency-groups]
dev = [
    "basedpyright>=1.39,<2",
    "black>=25,<26",
    "flow-matching>=1.0.10,<2",
    "isort>=5,<6",
    "pytest>=8,<9",
    "torch-kde>=0.1.5",
]

# Accelerator groups for PyTorch
# (select a build variant with, e.g., `uv sync --group cpu`)
# (without a group, `torch` resolves from PyPI: CUDA on Linux, CPU on macOS/Windows)
# (each group repeats `torch` because uv requires the package under the gated group)
cpu = ["torch>=2,<3"]
cu126 = ["torch>=2,<3"]
cu128 = ["torch>=2,<3"]
cu130 = ["torch>=2,<3"]

# Published optional dependencies
[project.optional-dependencies]
diffusion = [
    "flow-matching>=1.0.10,<2",
]
kde = [
    "torch-kde>=0.1.5",
]

[project.urls]
Homepage = "https://github.com/johannrudi/deep-learning-toolkit"
Repository = "https://github.com/johannrudi/deep-learning-toolkit"
Issues = "https://github.com/johannrudi/deep-learning-toolkit/issues"
Changelog = "https://github.com/johannrudi/deep-learning-toolkit/blob/main/CHANGELOG.md"

#[project.scripts]
#dlk = "dlk.__main__:main"

# --------------------------------------
# Tools
# --------------------------------------

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
src_paths = ["dlk", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
required-version = ">=0.12.1,<0.13"
# allow at most one accelerator group per environment
# (uv locks each variant separately; `uv sync --all-groups` is rejected)
conflicts = [
    [
        { group = "cpu" },
        { group = "cu126" },
        { group = "cu128" },
        { group = "cu130" },
    ],
]

# --------------------------------------
# Build System
# --------------------------------------

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# set a custom module location
[tool.uv.build-backend]
module-name = "dlk"
module-root = ""

# --------------------------------------
# Package Sources
# --------------------------------------

# route `torch` to an accelerator index when the matching group is enabled
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-cu130", group = "cu130" },
]

# PyTorch indexes, marked explicit so they serve only the pinned packages
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
