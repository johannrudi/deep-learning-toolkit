# Licensing of files that cannot carry a machine-readable header; see
# https://reuse.software/spec/. Every other file has its own SPDX header.
# The last matching entry wins.
version = 1

# Images in the documentation
[[annotations]]
path = "docs/images/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-present Johann Rudi <jrudi@vt.edu>"
SPDX-License-Identifier = "CC-BY-4.0"

# Example notebooks carry the header in their first cell, which reuse cannot parse
[[annotations]]
path = "examples/**.ipynb"
precedence = "override"
SPDX-FileCopyrightText = "2024-present Johann Rudi <jrudi@vt.edu>"
SPDX-License-Identifier = "Apache-2.0"

# Example adapted from facebookresearch/flow_matching, which is CC-BY-NC-4.0
[[annotations]]
path = "examples/opt/diffusion_flow_matching_2d_checkerboard.ipynb"
precedence = "override"
SPDX-FileCopyrightText = [
    "Meta Platforms, Inc. and affiliates",
    "2024-present Johann Rudi <jrudi@vt.edu>",
]
SPDX-License-Identifier = "CC-BY-NC-4.0"

# JSON configuration files; file generated by uv
[[annotations]]
path = [".zenodo.json", ".claude/settings.json", "uv.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-present Johann Rudi <jrudi@vt.edu>"
SPDX-License-Identifier = "Apache-2.0"
